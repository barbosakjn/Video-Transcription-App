services:
  # Redis Database
  - type: redis
    name: video-transcription-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # Backend API (includes worker in same process for free tier)
  - type: web
    name: video-transcription-api
    runtime: node
    plan: free
    buildCommand: cd backend && npm install --production=false && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: REDIS_HOST
        fromService:
          type: redis
          name: video-transcription-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: video-transcription-redis
          property: port
      - key: OPENAI_API_KEY
        sync: false
      - key: MAX_FILE_SIZE
        value: 2147483648
      - key: MAX_VIDEO_DURATION
        value: 3000
      - key: UPLOAD_TIMEOUT
        value: 1800000
      - key: TEMP_UPLOAD_DIR
        value: /tmp/uploads
      - key: TEMP_AUDIO_DIR
        value: /tmp/audio
      - key: CLEANUP_INTERVAL
        value: 3600000
      - key: FILE_TTL
        value: 3600
      - key: RESULT_TTL
        value: 86400
      - key: WORKER_CONCURRENCY
        value: 3
      - key: PROCESSING_TIMEOUT
        value: 7200000
      - key: FFMPEG_PATH
        value: ffmpeg
      - key: FFPROBE_PATH
        value: ffprobe
      - key: RATE_LIMIT_WINDOW
        value: 3600000
      - key: RATE_LIMIT_MAX_ANONYMOUS
        value: 3
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: LOG_LEVEL
        value: info
      - key: ENABLE_METRICS
        value: false

  # Frontend
  - type: web
    name: video-transcription-frontend
    runtime: static
    buildCommand: cd frontend && npm install --production=false && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: video-transcription-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
